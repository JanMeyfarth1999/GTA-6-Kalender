<!DOCTYPE html>
    <html lang="de">
        <head>  
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GTA 6 Kalender</title>
            <link rel="stylesheet" href="style.css">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&display=swap" rel="stylesheet">
        </head>
            <body>
                <div class="hud-frame">
                    <h1 id="main-headline" class="wichtige_überschrift">Kalenderdatenblatt <br><br> vom <br><br> 21.07.2026</h1>
                </div>  
                <!--Gesamte Kalender-Seite -->
                <main class="kalender-seite">
                    <!-- iFruit Handy -->
                     <div class="handy">
                        <img
                            src="images/phones/Januar.png"
                            alt="iFruit Handy"
                            id="handyBild"
                        >
                    <!-- Kalender-App -->
                        <img
                            src="images/phones/calendar/KAlenderRoh.png"
                            alt="Kalender"
                            id="kalenderBild"
                        >                    
                     </div>
                     <!--Titel-Logo-->
                        <img
                            src="images/Logo/logo.png"
                            alt="Logo"
                            id="logoBild"
                        >
                </main>

                <script src="script.js"></script>


            </body>

    </html>
